<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMDB Setup</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090909; color: #fff; padding: 24px; }
      main { width: min(560px, 100%); background: #111; border: 1px solid #262626; border-radius: 18px; padding: 22px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 18px; color: #aaa; line-height: 1.5; }
      input { width: 100%; border: 1px solid #333; background: #080808; color: #fff; border-radius: 12px; padding: 13px 14px; font: inherit; outline: none; }
      input:focus { border-color: #666; }
      .actions { display: flex; gap: 10px; margin-top: 12px; }
      button { border: 1px solid #333; background: #181818; color: #fff; border-radius: 11px; padding: 11px 14px; font: inherit; cursor: pointer; }
      button.primary { background: #fff; color: #000; border-color: #fff; }
      #status { min-height: 22px; margin-top: 12px; color: #a8a8a8; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>TMDB setup</h1>
      <p>Your TMDB Read Access Token is stored only in this browser's local storage. It is not committed to the repository.</p>
      <input id="token" type="password" autocomplete="off" placeholder="Paste TMDB Read Access Token" />
      <div class="actions">
        <button class="primary" id="save">Save & open P-Stream</button>
        <button id="clear">Clear</button>
      </div>
      <div id="status"></div>
    </main>
    <script>
      const key = "pstream-tmdb-read-token";
      const input = document.getElementById("token");
      const status = document.getElementById("status");

      try {
        if (localStorage.getItem(key)) status.textContent = "A TMDB token is already saved in this browser.";
      } catch {
        status.textContent = "Browser storage is unavailable.";
      }

      document.getElementById("save").addEventListener("click", () => {
        const value = input.value.trim();
        if (!value) {
          status.textContent = "Paste a token first.";
          return;
        }
        try {
          localStorage.setItem(key, value);
          window.location.href = "./";
        } catch {
          status.textContent = "Could not save the token in browser storage.";
        }
      });

      document.getElementById("clear").addEventListener("click", () => {
        try {
          localStorage.removeItem(key);
          input.value = "";
          status.textContent = "Saved TMDB token cleared.";
        } catch {
          status.textContent = "Could not access browser storage.";
        }
      });
    </script>
  </body>
</html>
