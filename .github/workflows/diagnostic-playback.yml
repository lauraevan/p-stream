name: Diagnostic Playback

on:
  push:
    branches:
      - diagnostic-playback
  pull_request:
    branches:
      - production

jobs:
  playback:
    if: github.head_ref == 'diagnostic-playback' || github.ref == 'refs/heads/diagnostic-playback'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install app
        run: pnpm install --no-frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Install Playwright test harness
        run: pnpm add -D @playwright/test@1.55.0 --ignore-workspace-root-check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start preview
        run: |
          pnpm run preview --host 127.0.0.1 > /tmp/synapse-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/synapse-preview.log
          exit 1

      - name: Verify video actually advances
        run: pnpm exec playwright test e2e/diagnostic-playback.spec.js --reporter=line

      - name: Preview log
        if: always()
        run: cat /tmp/synapse-preview.log || true
